<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1120">
<title>Cloud Todo</title>
<link rel="stylesheet" href="todo.css">
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">CT</div>
      <div class="brand-text">
        <h1>Cloud Todo</h1>
        <p>Sync your tasks across devices</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="userEmail" class="user-chip hidden"></span>
      <button id="signOutBtn" class="btn btn-ghost btn-sm hidden" type="button">Sign out</button>
    </div>
  </header>

  <!-- AUTH SCREEN -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Sign in to sync your tasks across all your devices.</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-mode="signin" type="button" role="tab">Sign in</button>
        <button class="auth-tab" data-mode="signup" type="button" role="tab">Create account</button>
      </div>

      <form id="authForm" class="auth-form" novalidate>
        <label class="field-label" for="authEmail">Email</label>
        <input type="email" id="authEmail" name="email" class="field" placeholder="you@example.com" required autocomplete="email">

        <label class="field-label" for="authPassword">Password</label>
        <input type="password" id="authPassword" name="password" class="field" placeholder="At least 6 characters" required minlength="6" autocomplete="current-password">

        <button type="submit" id="authSubmit" class="btn btn-primary btn-full">Sign in</button>
      </form>

      <div id="authError" class="auth-error hidden" role="alert"></div>
      <div id="authInfo" class="auth-info hidden" role="status"></div>
    </div>
  </section>

  <!-- TODO SCREEN -->
  <section id="todoScreen" class="todo-screen hidden">
    <div class="card">

      <form id="taskForm" class="task-form" autocomplete="off">
        <input type="text" id="taskInput" class="field" placeholder="Add a task..." maxlength="200" autocomplete="off">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <div class="toolbar">
        <div class="search-wrap">
          <input type="search" id="searchInput" class="field field-search" placeholder="Search tasks..." autocomplete="off">
        </div>
        <div class="filters" role="tablist">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="done" type="button">Done</button>
        </div>
      </div>

      <div id="syncStatus" class="sync-status">
        <span class="sync-dot"></span>
        <span id="syncText">Ready</span>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty hidden"></div>

      <div class="stats-row">
        <span id="statsText" class="stats-text">0 active</span>
        <button id="clearDoneBtn" class="btn btn-ghost btn-sm" type="button">Clear done</button>
      </div>

    </div>
  </section>

</div>

<div id="toast" class="toast hidden" role="status"></div>

<script type="module" src="todo.js"></script>
</body>
</html>
